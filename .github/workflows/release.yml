name: Release

# Cuts a signed release. Triggered manually (or by pushing a v* tag) so that publishing is
# always a deliberate act. The signing key lives only in encrypted repository secrets and is
# materialised inside the runner for the length of one job.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and verify the signature, but do not publish the release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Public SHA-256 of the release signing certificate. It ships inside every published APK, so it
  # is not a secret - it is the guard that stops a differently-signed APK going out, which Android
  # would refuse to install over an existing install. PLACEHOLDER until a keystore exists - see
  # .github/workflows/README-release.md, step "Pin the signing certificate fingerprint".
  EXPECTED_SIGNER: "7c50709e598856a9a80a75afff9dfb60f1b8d4f682e7ee2bef036bafa79ed8ea"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy standalone `tools` package (default: "tools platform-tools")
          # from its SDK repository around 2026-09-15; requesting it now hard-fails sdkmanager
          # before this action gets to installing cmdline-tools. platform-tools is all this
          # workflow actually needs - build-tools/platforms are installed explicitly below.
          packages: 'platform-tools'

      - name: Install the SDK packages this project compiles against
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          set -euo pipefail
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME"  >> "$GITHUB_OUTPUT"
          echo "Building v$NAME (versionCode $CODE)"

      - name: Check the tag matches the version in the build file
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.tag }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${{ steps.version.outputs.name }}"
            exit 1
          fi

      - name: Refuse to republish an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release ${{ steps.version.outputs.tag }} already exists — bump the version first."
            exit 1
          fi

      - name: Extract release notes from the About tab changelog
        id: notes
        run: |
          set -euo pipefail
          python3 - "${{ steps.version.outputs.name }}" <<'PY' > release-notes.md
          import re, sys
          version = sys.argv[1]
          about = open('app/src/main/kotlin/com/denonmusic/app/about/AboutScreen.kt').read()
          entry = re.search('"' + re.escape(version) + r'"\s*to\s*listOf\((?P<body>.*?)\r?\n\s*\)', about, re.S)
          if not entry:
              sys.exit(f"No CHANGELOG entry for {version} in AboutScreen.kt — add one before publishing.")
          # A bullet too long for one line is written as a Kotlin string concatenation
          # ("a " + "b"), so collapse the joins before matching literals - otherwise every
          # continuation line becomes a bullet of its own, which is how v0.1.7 shipped notes
          # split mid-sentence. Must stay in step with publish-release.ps1's own parser.
          body = re.sub(r'"\s*\+\s*"', '', entry.group('body'))
          bullets = [b.replace('\\"', '"').replace('\\\\', '\\')
                     for b in re.findall(r'"((?:[^"\\]|\\.)*)"', body)]
          if not bullets:
              sys.exit(f"CHANGELOG entry for {version} is empty.")
          print("\n".join(f"- {b}" for b in bullets))
          PY
          cat release-notes.md

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :core:heos:test :core:avr:test :core:smb:test :core:data:testDebugUnitTest

      - name: Materialise the signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 is not set. See .github/workflows/README-release.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          # An absolute storeFile avoids ambiguity: build.gradle.kts resolves it with the app
          # module's file(), not the root project's.
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"

      - name: Build the signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify the APK carries the expected signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK not found — the signing config did not apply, so the build is unsigned."
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -oP 'SHA-256 digest:\s*\K[0-9a-f]{64}' | head -1)
          if [ "$EXPECTED_SIGNER" = "REPLACE_ME_AFTER_FIRST_KEYSTORE_SETUP" ]; then
            echo "::warning::EXPECTED_SIGNER is still a placeholder — signature is NOT being verified. Pin it (see README-release.md) before relying on this guard."
          elif [ "$ACTUAL" != "$EXPECTED_SIGNER" ]; then
            echo "::error::Unexpected signer. expected=$EXPECTED_SIGNER actual=$ACTUAL"
            exit 1
          else
            echo "Signer matches the release key."
          fi
          cp "$APK" "DenonMusic-${{ steps.version.outputs.tag }}.apk"

      - name: Publish
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "DenonMusic-${{ steps.version.outputs.tag }}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
          gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --json tagName,assets --jq '"\(.tagName): \(.assets | map(.name) | join(", "))"'

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run — nothing published."
          echo "Would publish ${{ steps.version.outputs.tag }} with DenonMusic-${{ steps.version.outputs.tag }}.apk"

      - name: Destroy the signing material
        if: always()
        run: |
          shred -u "$GITHUB_WORKSPACE/release.keystore" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/release.keystore"
          shred -u "$GITHUB_WORKSPACE/keystore.properties" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/keystore.properties"
