name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The protocol modules deliberately carry no Android dependencies, so they build and test
      # without an SDK. Keeping this a separate job means a protocol regression is reported as
      # such rather than buried in an Android build log.
      #
      # All three SDK-free modules run here. :app and :core:data are deliberately absent - they are
      # Android-gated in settings.gradle.kts and aren't even configured without an SDK, so they run
      # in the `android` job below instead.
      - name: Run JVM tests
        run: ./gradlew :core:heos:test :core:avr:test :core:smb:test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: |
            core/heos/build/reports/tests/test
            core/avr/build/reports/tests/test
            core/smb/build/reports/tests/test
          if-no-files-found: ignore

  probe:
    name: Probe syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the probe
        run: python -m py_compile tools/probe.py

  android:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app module exists yet
        id: app
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No :app module yet - skipping the Android build."
          fi

      - uses: actions/setup-java@v4
        if: steps.app.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.app.outputs.present == 'true'
        with:
          # See .github/workflows/release.yml for why this can't be the action's own default.
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.app.outputs.present == 'true'

      # The Android-gated modules' unit tests belong here rather than in the `protocol` job: that
      # runner has no SDK, so settings.gradle.kts doesn't even include :app/:core:data there.
      - name: Run Android-module unit tests
        if: steps.app.outputs.present == 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Static analysis runs in this job, not `protocol`, because both halves need the full module
      # set: without an SDK, settings.gradle.kts leaves :app and :core:data out of the build entirely,
      # so a ktlintCheck over there would silently skip most of the codebase. ktlint's rules live in
      # .editorconfig; Android Lint's severities in app/build.gradle.kts.
      - name: Check formatting and lint
        if: steps.app.outputs.present == 'true'
        run: ./gradlew ktlintCheck :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload Android test report
        if: always() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Assemble debug
        if: steps.app.outputs.present == 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: denonmusic-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
